<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>Shiki 选择性委派架构</title>
<style>

  html, body { width: 1200px; height: 760px; overflow: hidden; }

        <text x="1082" y="272" fill="#141413" font-family="var(--serif)" font-size="16" font-weight="600" text-anchor="middle">已验证结果</text>
        <text x="1082" y="296" fill="#504e49" font-family="var(--mono)" font-size="12" text-anchor="middle">主模型最终交付</text>

        <text x="888" y="624" fill="#141413" font-family="var(--serif)" font-size="16">qa-runner · gpt-5.6-luna</text>

      <text x="48" y="736" fill="#6b6a64" font-family="var(--mono)" font-size="11" letter-spacing="1">SCOPE · 安装、权限、并发和 Git 约束见 README 与规则文件</text>
